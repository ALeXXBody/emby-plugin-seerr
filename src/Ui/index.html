<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer">
<title>Requests</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#242936;--txt:#e8eaf0;--dim:#9aa1b2;--acc:#7c5cff;--ok:#3fb26f;--warn:#e0a63c;--dl:#4a90d9;--part:#2fa6a0;--err:#d95c5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px 10px}
h1{margin:0;font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
#dot{width:9px;height:9px;border-radius:50%;background:#666;flex:none}
#dot.on{background:var(--ok)} #dot.off{background:#d95c5c}
.searchbar{display:flex;gap:8px;margin-top:10px}
input[type=search],input[type=text],input[type=password]{flex:1;width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);padding:11px 14px;border-radius:10px;font-size:16px;outline:none}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,92,255,.35)}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{background:none;border:1px solid var(--line);color:var(--dim);padding:7px 14px;border-radius:99px;font-size:13px;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:900px;margin:0 auto;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--acc)}
.poster{position:relative;width:100%;aspect-ratio:2/3;background:#222633}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.noposter{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#555;font-size:30px}
.meta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.t{font-size:13px;font-weight:600;line-height:1.25;max-height:32px;overflow:hidden}
.y{font-size:11px;color:var(--dim)}
button.req,button.primary{margin-top:auto;width:100%;border:0;border-radius:8px;padding:11px 0;font-size:14px;font-weight:700;color:#fff;background:var(--acc);cursor:pointer}
button.req:disabled,button.primary:disabled{opacity:.55;cursor:default}
button.ghost{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer}
.badge{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.4px;padding:3px 8px;border-radius:99px;text-transform:uppercase}
.b-req{background:var(--warn);color:#231a05}
.b-proc{background:var(--dl);color:#fff}
.b-part{background:var(--part);color:#fff}
.b-ok{background:var(--ok);color:#03130a}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#23283a;color:var(--txt);padding:11px 18px;border-radius:12px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.hint{color:var(--dim);font-size:13px;text-align:center;margin:40px 16px;line-height:1.6}
.spin{width:34px;height:34px;margin:60px auto;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.more{display:block;margin:18px auto;padding:10px 26px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:14px;font-weight:700;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(5,6,10,.78);display:none;z-index:40;padding:16px;overflow-y:auto}
.modal.open{display:block}
.sheet{max-width:900px;margin:20px auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px}
.mhead{display:flex;align-items:center;gap:10px}
.mhead h2{margin:0;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;flex:none}
.sub{color:var(--dim);font-size:12px;margin:4px 0 14px}
#app{display:none}
#login{max-width:400px;margin:48px auto;padding:0 16px}
#login .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px}
#login h2{margin:0 0 6px;font-size:20px}
#login p{margin:0 0 16px;color:var(--dim);font-size:13px;line-height:1.45}
#login label{display:block;font-size:12px;color:var(--dim);margin:0 0 6px}
#login .field{margin-bottom:12px}
#login .row{display:flex;align-items:center;gap:8px;margin:4px 0 12px;font-size:13px;color:var(--dim)}
#loginErr{color:var(--err);font-size:13px;min-height:18px;margin:8px 0 0}
#who{margin-left:auto;font-size:12px;color:var(--dim);font-weight:500}
.hdr-row{display:flex;align-items:center;gap:8px}
.tab:focus,.req:focus,.more:focus,.x:focus,.card.click:focus,button.primary:focus,button.ghost:focus{outline:3px solid var(--acc);outline-offset:2px}
.req:focus{transform:scale(1.04)}
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <h2>Requests</h2>
    <p>Sign in with your Emby account to search and request titles.</p>
    <div class="field">
      <label for="user">Username</label>
      <input id="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    </div>
    <div class="field">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password">
    </div>
    <label class="row"><input id="remember" type="checkbox"> Remember me on this device</label>
    <button class="primary" id="btnLogin" type="button">Sign in</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="app">
<header>
  <div class="hdr-row">
    <h1><span id="dot"></span>Requests</h1>
    <span id="who"></span>
    <button class="ghost" id="btnLogout" type="button">Sign out</button>
  </div>
  <div class="searchbar">
    <input id="q" type="search" placeholder="Search movies &amp; shows..." autocomplete="off">
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="trending" type="button">Trending</button>
    <button class="tab" data-tab="search" type="button">Search</button>
    <button class="tab" data-tab="mine" type="button">Recent</button>
  </div>
</header>
<main id="content"><p class="hint">Loading trending...</p></main>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="mhead"><h2 id="mtitle"></h2><button class="x" id="btnCloseModal" type="button">Close</button></div>
    <p class="sub" id="msub"></p>
    <div id="mbody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
var $=function(s){return document.querySelector(s)};
var TMDB='https://image.tmdb.org/t/p/w200';
var trendPage=1;
var TOKEN_KEY='seerr_emby_token';
var USER_KEY='seerr_emby_user';
var DEVICE_ID_KEY='seerr_emby_device';
var REMEMBER_KEY='seerr_emby_remember';

function deviceId(){
 try{
  var id=localStorage.getItem(DEVICE_ID_KEY);
  if(id)return id;
  id='seerr-ui-'+Math.random().toString(36).slice(2)+Date.now().toString(36);
  localStorage.setItem(DEVICE_ID_KEY,id);
  return id;
 }catch(e){return 'seerr-ui-web'}
}
function embyAuthHeader(token){
 var h='MediaBrowser Client="Seerr Requests", Device="Mobile Web", DeviceId="'+deviceId()+'", Version="1.4.5"';
 if(token)h+=', Token="'+token+'"';
 return h;
}
function rememberPreferred(){
 try{return localStorage.getItem(REMEMBER_KEY)==='1'}catch(e){return false}
}
function setRememberPreferred(on){
 try{if(on)localStorage.setItem(REMEMBER_KEY,'1');else localStorage.removeItem(REMEMBER_KEY)}catch(e){}
}
function readStoredToken(){
 try{
  return sessionStorage.getItem(TOKEN_KEY)||localStorage.getItem(TOKEN_KEY)||'';
 }catch(e){return ''}
}
function readStoredUser(){
 try{
  return sessionStorage.getItem(USER_KEY)||localStorage.getItem(USER_KEY)||'';
 }catch(e){return ''}
}
function saveSession(token,userName,remember){
 try{
  setRememberPreferred(!!remember);
  var store=remember?localStorage:sessionStorage;
  var other=remember?sessionStorage:localStorage;
  store.setItem(TOKEN_KEY,token);
  if(userName)store.setItem(USER_KEY,userName);
  other.removeItem(TOKEN_KEY);
  other.removeItem(USER_KEY);
 }catch(e){}
}
function clearSession(){
 try{
  sessionStorage.removeItem(TOKEN_KEY);sessionStorage.removeItem(USER_KEY);
  localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(USER_KEY);
 }catch(e){}
}
// Headers only — never put tokens in the URL (history/logs/Referer).
function authToken(){return readStoredToken()||''}
function apiUrl(path){
 var p=String(path||'');
 if(p.indexOf('http')===0)return p;
 p=p.replace(/^\.\.\//,'').replace(/^\/+/,'');
 if(p.indexOf('emby/')!==0)p='emby/Seerr/'+p;
 return '/'+p;
}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},2600)}
async function api(path,opt){
 opt=opt||{};
 opt.credentials='same-origin';
 opt.headers=opt.headers||{};
 var t=authToken();
 if(t){
  if(!opt.headers['X-Emby-Token'])opt.headers['X-Emby-Token']=t;
  if(!opt.headers['X-Emby-Authorization'])opt.headers['X-Emby-Authorization']=embyAuthHeader(t);
 }else if(!opt.headers['X-Emby-Authorization']){
  opt.headers['X-Emby-Authorization']=embyAuthHeader('');
 }
 var r=await fetch(apiUrl(path),opt);
 if(r.status===401){
  clearSession();
  showLogin('Session expired — sign in again.');
 }
 if(r.status===403){
  var body=await r.text();
  var e=null;try{e=JSON.parse(body)}catch(x){}
  toast((e&&e.error)||'Not allowed');
  return{status:r.status,text:body};
 }
 if(r.status===429){
  var b=await r.text();
  var j=null;try{j=JSON.parse(b)}catch(x){}
  toast((j&&j.error)||'Too many requests — slow down');
  return{status:r.status,text:b};
 }
 return{status:r.status,text:await r.text()}
}
function jparse(o){try{return JSON.parse(o.text)}catch(e){return null}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeMediaType(mt){
 mt=String(mt||'').toLowerCase();
 return (mt==='movie'||mt==='tv')?mt:'';
}
function safePosterUrl(path){
 if(!path||typeof path!=='string')return'';
 // TMDB paths look like /abc.jpg — reject anything else (XSS via src=).
 if(!/^\/[A-Za-z0-9_./-]+$/.test(path))return'';
 if(path.indexOf('..')>=0)return'';
 return TMDB+path;
}
function safeTmdbId(id){
 var n=parseInt(id,10);
 return (n>0&&n<1e12)?n:0;
}
function badgeFor(st){
 if(st===5)return'<span class="badge b-ok">Available</span>';
 if(st===4)return'<span class="badge b-part">Partial</span>';
 if(st===3)return'<span class="badge b-proc">Processing</span>';
 if(st===2)return'<span class="badge b-req">Pending</span>';
 return'';
}
function card(item){
 var mt=safeMediaType(item.mediaType);
 if(!mt)return'';
 var title=mt==='movie'?item.title:(item.name||item.title);
 var year=(mt==='movie'?item.releaseDate:(item.firstAirDate||''))||'';
 year=year?String(year).slice(0,4):'';
 if(year&&!/^\d{4}$/.test(year))year='';
 var st=item.mediaInfo?item.mediaInfo.status:0;
 var poster=safePosterUrl(item.posterPath);
 var tid=safeTmdbId(item.tmdbId||item.id||0);
 var btn=(st>=2&&st<=5)||!tid?'':'<button type="button" class="req" data-act="request" data-mt="'+mt+'" data-id="'+tid+'">Request</button>';
 return '<div class="card click" tabindex="0" data-act="recs" data-mt="'+mt+'" data-tid="'+tid+'" data-title="'+esc(title)+'">'+
   '<div class="poster">'+(poster?'<img loading="lazy" alt="" src="'+esc(poster)+'">':'<div class="noposter">&#127916;</div>')+'</div>'+
   '<div class="meta"><span class="t">'+esc(title)+'</span><span class="y">'+esc(year)+'</span>'+badgeFor(st)+btn+'</div></div>';
}
function onGridClick(e){
 var req=e.target.closest('[data-act="request"]');
 if(req){
  e.preventDefault();e.stopPropagation();
  doRequest(req,req.getAttribute('data-mt'),parseInt(req.getAttribute('data-id'),10));
  return;
 }
 var cardEl=e.target.closest('[data-act="recs"]');
 if(cardEl)openRecs(cardEl);
}
$('#content').addEventListener('click',onGridClick);
$('#mbody').addEventListener('click',onGridClick);
function doRequest(btn,mt,id){
 mt=safeMediaType(mt);id=safeTmdbId(id);
 if(!mt||!id)return;
 btn.disabled=true;btn.textContent='Sending...';
 api('Request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mediaType:mt,mediaId:id})})
 .then(function(r){
  if(r.status<300){btn.outerHTML='<span class="badge b-req">Pending</span>';toast('Request sent to Seerr')}
  else{btn.disabled=false;btn.textContent='Retry';var e=jparse(r);toast((e&&e.error)?('Error: '+e.error):('Failed ('+r.status+')'))}
 });
}
function openRecs(el){
 var mt=safeMediaType(el.getAttribute('data-mt'));
 var tid=safeTmdbId(el.getAttribute('data-tid'));
 var title=el.getAttribute('data-title')||'';
 if(!mt||!tid)return;
 openModal();
 $('#mtitle').textContent=title;
 $('#msub').textContent='Recommended because of '+title;
 $('#mbody').innerHTML='<div class="spin"></div>';
 api('Recommended?mediaType='+encodeURIComponent(mt)+'&tmdbId='+tid).then(function(r){
  var d=jparse(r);
  if(r.status!==200||!d||!d.results){$('#mbody').innerHTML='<p class="hint">No recommendations found.</p>';return}
  var cards=d.results.map(card).join('');
  $('#mbody').innerHTML=cards?'<div class="grid">'+cards+'</div>':'<p class="hint">No recommendations for this title yet.</p>';
 });
}
function openModal(){$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open');$('#mbody').innerHTML=''}
$('#btnCloseModal').addEventListener('click',closeModal);
$('#modal').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
var timer=null,lastQ='';
$('#q').addEventListener('input',function(){
 clearTimeout(timer);
 var v=this.value.trim();
 timer=setTimeout(function(){if(v!==lastQ){lastQ=v;if(v.length>=2)doSearch(v);else if(!v)showIdle()}},420);
});
document.querySelectorAll('.tab').forEach(function(t){
 t.addEventListener('click',function(){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
  t.classList.add('on');
  if(t.dataset.tab==='trending'){doTrending(false)}
  else if(t.dataset.tab==='search'){$('#q').value='';showIdle();$('#q').focus()}
  else doRecent();
 });
});
function showIdle(){$('#content').innerHTML='<p class="hint">Type to search for movies and TV shows,<br>then tap a poster to see recommendations.</p>'}
async function doTrending(append){
 if(!append){$('#content').innerHTML='<div class="spin"></div>';trendPage=1}
 var r=await api('Discover?page='+trendPage);
 var d=jparse(r);
 if(r.status===403){$('#content').innerHTML='<p class="hint">Your account is not allowed to use Requests.</p>';return}
 if(r.status!==200||!d||!d.results){if(!append)$('#content').innerHTML='<p class="hint">Could not load trending ('+r.status+'). Is the plugin configured?</p>';return}
 var cards=d.results.map(card).join('');
 if(!cards&&!append){$('#content').innerHTML='<p class="hint">Nothing trending right now.</p>';return}
 if(append){var old=$('#more');if(old)old.remove()}
 else $('#content').innerHTML='';
 $('#content').insertAdjacentHTML('beforeend','<div class="grid" id="tg'+trendPage+'">'+cards+'</div>');
 trendPage++;
 var more=document.createElement('button');
 more.className='more';more.id='more';more.type='button';more.textContent='More';
 more.addEventListener('click',function(){doTrending(true)});
 $('#content').appendChild(more);
}
async function doSearch(q){
 $('#content').innerHTML='<div class="spin"></div>';
 var r=await api('Search?query='+encodeURIComponent(q));
 var d=jparse(r);
 if(r.status!==200||!d||!d.results){$('#content').innerHTML='<p class="hint">Search failed ('+r.status+'). Is the plugin configured?</p>';return}
 var cards=d.results.map(card).join('');
 $('#content').innerHTML=cards?'<div class="grid">'+cards+'</div>':'<p class="hint">No results for &quot;'+esc(q)+'&quot;</p>';
}
async function doRecent(){
 $('#content').innerHTML='<div class="spin"></div>';
 var r=await api('Requests?take=24');
 var d=jparse(r);
 if(r.status!==200||!d||!d.results){$('#content').innerHTML='<p class="hint">Could not load requests ('+r.status+').</p>';return}
 if(!d.results.length){$('#content').innerHTML='<p class="hint">No requests yet.</p>';return}
 var rows=d.results.map(function(req){
  var m=req.media||{};
  var title=req.is4k?(m.title4k||m.title):(m.title||m.name);
  var poster=safePosterUrl((req.is4k?(m.posterPath4k||m.posterPath):m.posterPath)||'');
  var who=req.requestedBy&&req.requestedBy.displayName?('<span class="y">by '+esc(req.requestedBy.displayName)+'</span>'):'';
  var st=req.status===1?2:(req.status===2?3:req.status===3?5:2);
  return '<div class="card"><div class="poster">'+(poster?'<img alt="" src="'+esc(poster)+'">':'<div class="noposter">&#127916;</div>')+'</div>'+
    '<div class="meta"><span class="t">'+esc(title)+'</span>'+who+badgeFor(st)+'</div></div>';
 }).join('');
 $('#content').innerHTML='<div class="grid rowlist">'+rows+'</div>';
}

function showLogin(msg){
 $('#login').style.display='block';
 $('#app').style.display='none';
 $('#loginErr').textContent=msg||'';
 try{$('#remember').checked=rememberPreferred()}catch(e){}
}
function showApp(userName){
 $('#login').style.display='none';
 $('#app').style.display='block';
 $('#who').textContent=userName||'';
 api('Ping').then(function(r){
  var ok=r.status===200&&(r.text.indexOf('"ok":true')>-1||r.text.indexOf('"ok": true')>-1);
  $('#dot').className=ok?'on':'off';
  if(r.status===403)$('#content').innerHTML='<p class="hint">Your account is not allowed to use Requests.</p>';
 }).catch(function(){$('#dot').className='off'});
 doTrending(false);
}
async function tryExistingSession(){
 // One-time migrate: if old bookmarks put api_key in the URL, adopt then strip it.
 try{
  var params=new URLSearchParams(location.search||'');
  var qTok=params.get('api_key')||params.get('ApiKey')||params.get('X-Emby-Token')||'';
  if(qTok){
   saveSession(qTok,'',rememberPreferred());
   if(history.replaceState){
    params.delete('api_key');params.delete('ApiKey');params.delete('X-Emby-Token');
    var q=params.toString();
    history.replaceState(null,'',location.pathname+(q?('?'+q):'')+location.hash);
   }
  }
 }catch(e){}

 var t=authToken();
 if(!t){showLogin();return}
 try{
  var r=await fetch('/emby/Users/Me',{
   credentials:'same-origin',
   headers:{
    'X-Emby-Token':t,
    'X-Emby-Authorization':embyAuthHeader(t)
   }
  });
  if(r.status===200){
   var u=await r.json();
   var name=u.Name||readStoredUser()||'';
   if(name)saveSession(t,name,rememberPreferred()||!!localStorage.getItem(TOKEN_KEY));
   showApp(name);
   return;
  }
 }catch(e){}
 clearSession();
 showLogin('');
}
async function doLogin(){
 var user=($('#user').value||'').trim();
 var pw=$('#pw').value||'';
 var remember=!!$('#remember').checked;
 var err=$('#loginErr');
 err.textContent='';
 if(!user){err.textContent='Enter your Emby username.';return}
 var btn=$('#btnLogin');
 btn.disabled=true;btn.textContent='Signing in...';
 try{
  var r=await fetch('/emby/Users/authenticatebyname',{
   method:'POST',
   credentials:'same-origin',
   headers:{
    'Content-Type':'application/json',
    'X-Emby-Authorization':embyAuthHeader('')
   },
   body:JSON.stringify({Username:user,Pw:pw})
  });
  var text=await r.text();
  var data=null;try{data=JSON.parse(text)}catch(e){}
  if(r.status!==200||!data||!data.AccessToken){
   err.textContent=(data&&(data.Message||data.message))||('Sign in failed ('+r.status+').');
   return;
  }
  var name=(data.User&&data.User.Name)||user;
  saveSession(data.AccessToken,name,remember);
  $('#pw').value='';
  showApp(name);
 }catch(e){
  err.textContent='Could not reach Emby. Check the address and try again.';
 }finally{
  btn.disabled=false;btn.textContent='Sign in';
 }
}
$('#btnLogin').addEventListener('click',doLogin);
$('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
$('#user').addEventListener('keydown',function(e){if(e.key==='Enter')$('#pw').focus()});
$('#btnLogout').addEventListener('click',function(){
 clearSession();
 showLogin('Signed out.');
});
tryExistingSession();
</script>
</body>
</html>
