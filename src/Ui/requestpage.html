<div is="emby-scroller" class="view flex flex-direction-column scrollFrameY flex-grow" data-horizontal="false" data-forcescrollbar="true" data-centerfocus="true" data-bindheader="true" data-title="Requests" data-controller="__plugin/seerrreqjs">
    <div class="scrollSlider flex-grow flex-direction-column padded-left padded-left-page padded-right padded-top-page padded-bottom-page">

        <div class="flex align-items-center" style="gap:10px;margin-bottom:12px;flex-wrap:wrap;">
            <h1 class="pageTitle" style="margin:0;flex:1 1 auto;">Requests</h1>
            <span id="seerrStatusDot" class="secondaryText" style="font-size:12px;" title="Seerr connection">● offline</span>
        </div>

        <div class="flex align-items-center" style="gap:8px;margin-bottom:14px;flex-wrap:wrap;">
            <div class="inputContainer" style="flex:1 1 220px;margin:0;min-width:180px;">
                <input is="emby-input" id="seerrSearch" type="search" placeholder="Search movies &amp; shows..." autocomplete="off" />
            </div>
            <button is="emby-button" type="button" class="raised button-submit" id="seerrBtnSearch"><span>Search</span></button>
        </div>

        <div class="emby-tabs flex align-items-center" style="gap:6px;margin-bottom:16px;flex-wrap:wrap;" role="tablist">
            <button is="emby-button" type="button" class="raised seerrTab on" data-tab="trending" id="seerrTabTrending"><span>Trending</span></button>
            <button is="emby-button" type="button" class="raised seerrTab" data-tab="search" id="seerrTabSearch"><span>Search</span></button>
            <button is="emby-button" type="button" class="raised seerrTab" data-tab="mine" id="seerrTabMine"><span>Recent</span></button>
        </div>

        <div id="seerrContent">
            <p class="secondaryText" style="text-align:center;margin:40px 16px;">Loading…</p>
        </div>

        <div id="seerrMoreWrap" class="hide" style="text-align:center;margin:18px 0 8px;">
            <button is="emby-button" type="button" class="raised" id="seerrBtnMore"><span>More</span></button>
        </div>

        <!-- recommendations dialog host -->
        <div id="seerrModal" class="hide" style="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);padding:16px;overflow:auto;">
            <div class="paperList" style="max-width:920px;margin:24px auto;padding:16px;background:var(--theme-body-bg,#1c1c1e);border-radius:12px;">
                <div class="flex align-items-center" style="gap:10px;margin-bottom:8px;">
                    <h2 id="seerrModalTitle" style="margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Recommendations</h2>
                    <button is="emby-button" type="button" class="raised" id="seerrModalClose"><span>Close</span></button>
                </div>
                <p id="seerrModalSub" class="secondaryText" style="margin:0 0 14px;"></p>
                <div id="seerrModalBody"></div>
            </div>
        </div>

        <style>
            .seerr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
            .seerr-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
            .seerr-card:focus{outline:3px solid var(--theme-primary-color,#52b54b);outline-offset:2px}
            .seerr-poster{position:relative;width:100%;aspect-ratio:2/3;background:#222}
            .seerr-poster img{width:100%;height:100%;object-fit:cover;display:block}
            .seerr-noposter{width:100%;height:100%;display:flex;align-items:center;justify-content:center;opacity:.4;font-size:28px}
            .seerr-meta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
            .seerr-t{font-size:13px;font-weight:600;line-height:1.25;max-height:34px;overflow:hidden}
            .seerr-y{font-size:11px;opacity:.65}
            .seerr-badge{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.4px;padding:3px 8px;border-radius:99px;text-transform:uppercase}
            .seerr-b-req{background:#e0a63c;color:#231a05}
            .seerr-b-proc{background:#4a90d9;color:#fff}
            .seerr-b-part{background:#2fa6a0;color:#fff}
            .seerr-b-ok{background:#3fb26f;color:#03130a}
            .seerr-reqbtn{margin-top:auto;width:100%}
            button.seerrTab.on{background:var(--theme-primary-color,#52b54b);color:#fff}
            #seerrStatusDot.on{color:#3fb26f}
            #seerrStatusDot.off{color:#d95c5c}
            .hide{display:none!important}
        </style>
    </div>
</div>
