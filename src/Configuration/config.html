<div is="emby-scroller" class="view flex flex-direction-column scrollFrameY flex-grow withTabs" data-horizontal="false" data-forcescrollbar="true" data-centerfocus="true" data-bindheader="true" data-title="Seerr Requests" data-helpurl="https://github.com/ALeXXBody/emby-plugin-seerr" data-controller="__plugin/seerrconfigjs">
    <div class="scrollSlider flex-grow flex-direction-column padded-left padded-left-page padded-right padded-top-page padded-bottom-page settingsContainer">
        <form class="seerrConfigForm auto-center" style="max-width:640px">

            <h2>Seerr Requests</h2>
            <p style="color:#888">Link your Seerr (Overseerr/Jellyseerr) instance. Users then open <b>/emby/Seerr/Ui</b> to browse &amp; request media.</p>

            <div class="inputContainer">
                <label class="inputLabel" for="SeerrUrl">Seerr URL</label>
                <input is="emby-input" id="SeerrUrl" type="url" placeholder="http://192.168.1.10:5055" />
                <div class="fieldDescription">Base URL of your Seerr server.</div>
            </div>

            <div class="inputContainer">
                <label class="inputLabel" for="SeerrApiKey">Seerr API Key</label>
                <input is="emby-input" id="SeerrApiKey" type="password" placeholder="API key" />
                <div class="fieldDescription">Seerr &#8594; Settings &#8594; General &#8594; API Key.</div>
            </div>

            <div class="inputContainer">
                <label class="inputLabel" for="AllowedUsers">Allowed users (optional)</label>
                <input is="emby-input" id="AllowedUsers" type="text" placeholder="alice,bob" />
                <div class="fieldDescription">Comma separated Emby user names allowed to use the request UI. Leave empty for everyone.</div>
            </div>

            <button is="emby-button" type="submit" class="raised button-submit block">
                <span>Save</span>
            </button>
        </form>
    </div>
</div>
