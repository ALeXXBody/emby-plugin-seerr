name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Emby reference DLLs (from official Docker image)
        run: ./scripts/restore-libs.sh --docker

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/Emby.Plugin.Seerr.csproj -c Release

      - name: Package
        run: |
          mkdir -p dist
          cp src/bin/Release/Emby.Plugin.Seerr.dll dist/
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Emby.Plugin.Seerr
          path: dist/
